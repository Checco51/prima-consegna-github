<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Dati Rettangolo</title>
</head>
<body>
    <h2>Calcolo Perimetro e Area del Rettangolo</h2>
    
    <form action="calcola.php" method="POST">
        <label for="base">Inserire base:</label>
        <input type="number" id="base" name="base" step="any" required>

        <label for="altezza">Inserire altezza:</label>

        <input type="reset" value="Cancella valori">
    </form>
</body>
</html>
